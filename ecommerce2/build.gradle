plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.0'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.ecommerce'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.mongodb:mongodb-driver-sync:5.2.1'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'io.github.cdimascio:dotenv-java:2.2.0' // dotenv-java kütüphanesi
	implementation 'org.mapstruct:mapstruct:1.5.5.Final' // MapStruct çekirdek kütüphanesi
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final' // Kod üretici
	implementation 'org.modelmapper:modelmapper:3.1.0' // ModelMapper kütüphanesi
	//implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // JPA bağımlılığı
	implementation 'org.projectlombok:lombok' // Lombok bağımlılığı
	annotationProcessor 'org.projectlombok:lombok' // Lombok annotation processor
}

tasks.named('test') {
	useJUnitPlatform()
}
